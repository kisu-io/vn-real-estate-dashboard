function fmtVND(n) {
  if (n == null || isNaN(n)) return '—';
  if (n >= 1e12) return (n/1e12).toFixed(2) + ' T VND';
  if (n >= 1e9)  return (n/1e9).toFixed(2) + ' B VND';
  if (n >= 1e6)  return (n/1e6).toFixed(1) + ' M VND';
  return n.toLocaleString() + ' VND';
}
function fmtUSD(vnd) {
  if (vnd == null || isNaN(vnd)) return '—';
  const usd = vnd / VND_PER_USD;
  if (usd >= 1e6) return '$' + (usd/1e6).toFixed(2) + 'M';
  if (usd >= 1e3) return '$' + (usd/1e3).toFixed(1) + 'K';
  return '$' + Math.round(usd).toLocaleString();
}
function fmtPpm2(n) {
  if (n == null) return '—';
  return (n/1e6).toFixed(1) + ' M VND/m²';
}
function fmtPctDelta(n) {
  if (n == null) return '—';
  const sign = n >= 0 ? '+' : '';
  return sign + n.toFixed(1) + '%';
}
function fmtInt(n) {
  if (n == null) return '—';
  return Math.round(n).toLocaleString();
}
function niceMonth(s) {
  if (!s) return '';
  const [y,m] = s.split('-');
  const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return names[parseInt(m,10)-1] + " '" + y.slice(2);
}

function DeltaChip({ value, inverse=false }) {

  const good = inverse ? value < 0 : value >= 0;
  const color = good ? 'text-emerald-600 bg-emerald-50' : 'text-red-600 bg-red-50';
  const arrow = value >= 0 ? '▲' : '▼';
  return <span className={'inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded text-xs font-semibold num-mono ' + color}>{arrow} {Math.abs(value).toFixed(1)}%</span>;
}

function PricingSection() {
  const [ptype, setPtype] = useState('all');

  const chartData = useMemo(() => {
    const months = [...new Set(MONTHLY_CITY_TYPE.map(d => d.month))].sort();
    return months.map(m => {
      const row = { month: niceMonth(m), monthRaw: m };
      CITIES.forEach(city => {
        const pt = PROPERTY_TYPES.find(p => p.key === ptype);
        const recs = MONTHLY_CITY_TYPE.filter(d =>
          d.month === m && d.city === city && (ptype === 'all' || d.property_type_name === pt.vi)
        );
        if (ptype === 'all') {
          // weighted average of medians by listing count
          const totalListings = recs.reduce((s,r) => s + r.listings, 0);
          if (totalListings > 0) {
            const weightedPpm2 = recs.reduce((s,r) => s + r.median_ppm2 * r.listings, 0) / totalListings;
            row[city] = Math.round(weightedPpm2);
          }
        } else if (recs.length > 0) {
          row[city] = recs[0].median_ppm2;
        }
      });
      return row;
    });
  }, [ptype]);

  return (
    <Card>
      <CardHeader
        title="Pricing & trends"
        subtitle="Median listing price per m² by month. Select a property type to drill in."
        right={
          <Tabs
            value={ptype}
            onChange={setPtype}
            options={PROPERTY_TYPES.map(p => ({ value: p.key, label: p.label }))}
          />
        }
      />
      <CardBody>
        <div style={{width: '100%', height: 340}}>
          <Recharts.ResponsiveContainer>
            <Recharts.LineChart data={chartData} margin={{top: 10, right: 20, left: 10, bottom: 0}}>
              <Recharts.CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" />
              <Recharts.XAxis dataKey="month" tick={{fontSize: 12, fill: '#64748b'}} axisLine={false} tickLine={false} />
              <Recharts.YAxis
                tick={{fontSize: 12, fill: '#64748b'}} axisLine={false} tickLine={false}
                tickFormatter={v => (v/1e6).toFixed(0) + 'M'}
                label={{ value: 'VND / m²', angle: -90, position: 'insideLeft', offset: 10, fill: '#94a3b8', fontSize: 11 }}
              />
              <Recharts.Tooltip
                formatter={(v, name) => [fmtPpm2(v) + '  (≈ ' + fmtUSD(v) + '/m²)', name]}
                contentStyle={{borderRadius: 8, fontSize: 12, border: '1px solid #e2e8f0'}}
              />
              <Recharts.Legend iconType="circle" wrapperStyle={{fontSize: 12}} />
              {CITIES.map(city => (
                <Recharts.Line
                  key={city}
                  type="monotone"
                  dataKey={city}
                  stroke={CITY_COLORS[city]}
                  strokeWidth={2.5}
                  dot={{ r: 3 }}
                  activeDot={{ r: 5 }}
                />
              ))}
            </Recharts.LineChart>
          </Recharts.ResponsiveContainer>
        </div>
      </CardBody>
    </Card>
  );
}

/* =====================================================================
 * Section 2 — Supply & Inventory
 * ===================================================================== */
function SupplySection() {
  const supplyData = useMemo(() => {
    const months = [...new Set(MONTHLY_CITY_TYPE.map(d => d.month))].sort();
    return months.map(m => {
      const row = { month: niceMonth(m), monthRaw: m };
      CITIES.forEach(city => {
        const total = MONTHLY_CITY_TYPE
          .filter(d => d.month === m && d.city === city)
          .reduce((s, r) => s + r.listings, 0);
        row[city] = total;
      });
      return row;
    });
  }, []);

  // Hot districts = biggest MoM % change in listing volume, latest vs prev month
  const hotDistricts = useMemo(() => {
    const latest = META.month_range[1];
    const sorted = [...new Set(MONTHLY_CITY_DISTRICT.map(d => d.month))].sort();
    const prev = sorted[sorted.length - 2] || sorted[sorted.length - 1];
    const rows = [];
    const byKey = {};
    MONTHLY_CITY_DISTRICT.forEach(d => {
      const k = d.city + '||' + d.district_name;
      if (!byKey[k]) byKey[k] = {};
      byKey[k][d.month] = d;
    });
    Object.entries(byKey).forEach(([k, byMonth]) => {
      const L = byMonth[latest];
      const P = byMonth[prev];
      if (L && P && L.listings >= 50 && P.listings >= 50) {
        const pct = ((L.listings - P.listings) / P.listings) * 100;
        rows.push({
          city: L.city,
          district: L.district_name,
          latestListings: L.listings,
          prevListings: P.listings,
          pct,
          medPpm2: L.median_ppm2,
        });
      }
    });
    return rows.sort((a,b) => b.pct - a.pct).slice(0, 8);
  }, []);

  return (
    <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <Card className="lg:col-span-2">
        <CardHeader title="New listings per month" subtitle="Monthly volume of cleaned listings across the three cities." />
        <CardBody>
          <div style={{width: '100%', height: 300}}>
            <Recharts.ResponsiveContainer>
              <Recharts.AreaChart data={supplyData} margin={{top: 10, right: 20, left: 10, bottom: 0}}>
                <defs>
                  {CITIES.map(city => (
                    <linearGradient key={city} id={'grad-'+city.replace(' ','_')} x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stopColor={CITY_COLORS[city]} stopOpacity={0.4}/>
                      <stop offset="100%" stopColor={CITY_COLORS[city]} stopOpacity={0.05}/>
                    </linearGradient>
                  ))}
                </defs>
                <Recharts.CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" />
                <Recharts.XAxis dataKey="month" tick={{fontSize: 12, fill: '#64748b'}} axisLine={false} tickLine={false} />
                <Recharts.YAxis tick={{fontSize: 12, fill: '#64748b'}} axisLine={false} tickLine={false} tickFormatter={v => (v/1000).toFixed(0)+'k'} />
                <Recharts.Tooltip formatter={v => fmtInt(v) + ' listings'} contentStyle={{borderRadius: 8, fontSize: 12, border: '1px solid #e2e8f0'}} />
                <Recharts.Legend iconType="circle" wrapperStyle={{fontSize: 12}} />
                {CITIES.map(city => (
                  <Recharts.Area key={city}
                    type="monotone"
                    dataKey={city}
                    stroke={CITY_COLORS[city]}
                    fill={'url(#grad-'+city.replace(' ','_')+')'}
                    strokeWidth={2}
                  />
                ))}
              </Recharts.AreaChart>
            </Recharts.ResponsiveContainer>
          </div>
        </CardBody>
      </Card>

      <Card>
        <CardHeader title="Hottest districts MoM" subtitle="Largest month-over-month listing surges (≥50 listings both months)." />
        <CardBody className="pt-0">
          <div className="divide-y divide-slate-100">
            {hotDistricts.map((r, i) => (
              <div key={i} className="py-2.5 flex items-center justify-between gap-3">
                <div className="min-w-0">
                  <div className="text-sm font-medium text-slate-900 truncate">{r.district}</div>
                  <div className="text-xs text-slate-500">{r.city} · {fmtInt(r.latestListings)} listings</div>
                </div>
                <DeltaChip value={r.pct} />
              </div>
            ))}
          </div>
        </CardBody>
      </Card>
    </div>
  );
}

/* =====================================================================
 * Section 3 — District Price Map (Treemap)
 * ===================================================================== */
function DistrictMapSection() {
  const [city, setCity] = useState('HCMC');

  const treeData = useMemo(() => {
    // Aggregate full-period stats per district in selected city
    const byDistrict = {};
    MONTHLY_CITY_DISTRICT
      .filter(d => d.city === city)
      .forEach(d => {
        if (!byDistrict[d.district_name]) {
          byDistrict[d.district_name] = { name: d.district_name, listings: 0, ppm2Sum: 0, ppm2Weight: 0 };
        }
        const b = byDistrict[d.district_name];
        b.listings += d.listings;
        b.ppm2Sum += d.median_ppm2 * d.listings;
        b.ppm2Weight += d.listings;
      });

    const arr = Object.values(byDistrict).map(b => ({
      name: b.name,
      size: b.listings,
      ppm2: Math.round(b.ppm2Sum / b.ppm2Weight),
    }));
    // Sort by listings descending, keep top 20
    arr.sort((a,b) => b.size - a.size);
    return arr.slice(0, 20);
  }, [city]);

  // Color scale: low ppm2 → teal, high ppm2 → magenta
  const ppm2Vals = treeData.map(d => d.ppm2);
  const minP = Math.min(...ppm2Vals, 0);
  const maxP = Math.max(...ppm2Vals, 1);
  function colorFor(p) {
    const t = (p - minP) / (maxP - minP || 1);
    // interpolate from hsl(173 58% 55%) to hsl(340 75% 55%)
    const h = 173 + (340 - 173) * t;
    const s = 58 + (75 - 58) * t;
    return `hsl(${h} ${s}% 55%)`;
  }

  const CustomCell = ({ x, y, width, height, name, size, ppm2 }) => {
    if (width < 2 || height < 2) return null;
    const fill = colorFor(ppm2);
    const show = width > 70 && height > 40;
    return (
      <g>
        <rect x={x} y={y} width={width} height={height} style={{fill, stroke: '#fff', strokeWidth: 2}} />
        {show && (
          <>
            <text x={x+8} y={y+18} style={{fill: 'white', fontSize: 12, fontWeight: 600}}>{name}</text>
            <text x={x+8} y={y+34} style={{fill: 'rgba(255,255,255,.85)', fontSize: 10}}>{(ppm2/1e6).toFixed(0)}M VND/m²</text>
            {height > 55 && <text x={x+8} y={y+48} style={{fill: 'rgba(255,255,255,.75)', fontSize: 10}}>{fmtInt(size)} listings</text>}
          </>
        )}
      </g>
    );
  };

  return (
    <Card>
      <CardHeader
        title="District price map"
        subtitle="Each tile is a district. Size = listing volume, color = median price/m² (teal → pink = cheaper → pricier)."
        right={<Tabs value={city} onChange={setCity} options={CITIES.map(c => ({value: c, label: c}))} />}
      />
      <CardBody>
        <div style={{width: '100%', height: 420}}>
          <Recharts.ResponsiveContainer>
            <Recharts.Treemap
              data={treeData}
              dataKey="size"
              aspectRatio={16/9}
              stroke="#fff"
              content={<CustomCell />}
            >
              <Recharts.Tooltip
                formatter={(value, name, props) => {
                  if (!props || !props.payload) return value;
                  const p = props.payload;
                  return [
                    fmtInt(p.size) + ' listings · ' + fmtPpm2(p.ppm2) + ' (≈' + fmtUSD(p.ppm2) + '/m²)',
                    p.name
                  ];
                }}
                contentStyle={{borderRadius: 8, fontSize: 12, border: '1px solid #e2e8f0'}}
              />
            </Recharts.Treemap>
          </Recharts.ResponsiveContainer>
        </div>
        <p className="text-xs text-slate-400 mt-3">Top 20 districts by listing volume shown. Color scale is relative to the selected city, so tiles reflect within-city price ranking.</p>
      </CardBody>
    </Card>
  );
}

/* =====================================================================
 * Section 4 — Price Segmentation & Value Map
 * ===================================================================== */
function SegmentationSection() {
  const [ptype, setPtype] = useState('apartment');

  // Stacked bar: price tier distribution per city for selected property type
  const tierData = useMemo(() => {
    const pt = PROPERTY_TYPES.find(p => p.key === ptype);
    return CITIES.map(city => {
      const recs = MONTHLY_PRICE_TIERS.filter(d =>
        d.city === city && (ptype === 'all' || d.property_type_name === pt.vi)
      );
      // Aggregate across all months for an overall distribution
      const byTier = {};
      recs.forEach(r => { byTier[r.price_tier] = (byTier[r.price_tier] || 0) + r.listings; });
      const total = Object.values(byTier).reduce((s,v) => s+v, 0) || 1;
      const row = { city };
      TIER_ORDER.forEach(t => { row[t] = Math.round(((byTier[t] || 0) / total) * 100); });
      return row;
    });
  }, [ptype]);

  // Best value districts: lowest median ppm² per city for selected type, min 100 listings
  const bestValue = useMemo(() => {
    const pt = PROPERTY_TYPES.find(p => p.key === ptype);
    const filtered = DISTRICT_PROPERTY_STATS.filter(d =>
      (ptype === 'all' || d.property_type_name === pt.vi) && d.listings >= 100
    );
    return CITIES.map(city => {
      const rows = filtered.filter(d => d.city === city);
      rows.sort((a,b) => a.median_ppm2 - b.median_ppm2);
      return { city, top: rows.slice(0, 3) };
    });
  }, [ptype]);

  return (
    <div className="grid grid-cols-1 lg:grid-cols-5 gap-4">
      <Card className="lg:col-span-3">
        <CardHeader
          title="Price segmentation by city"
          subtitle="How listings split across price tiers (share of total listings)."
          right={
            <Tabs value={ptype} onChange={setPtype}
              options={PROPERTY_TYPES.filter(p => p.key !== 'all').map(p => ({ value: p.key, label: p.label }))}
            />
          }
        />
        <CardBody>
          <div style={{width: '100%', height: 260}}>
            <Recharts.ResponsiveContainer>
              <Recharts.BarChart layout="vertical" data={tierData} margin={{top: 10, right: 30, left: 10, bottom: 0}} stackOffset="expand">
                <Recharts.CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" horizontal={false} />
                <Recharts.XAxis type="number" tick={{fontSize: 11, fill: '#64748b'}} axisLine={false} tickLine={false} tickFormatter={v => Math.round(v*100) + '%'} />
                <Recharts.YAxis type="category" dataKey="city" tick={{fontSize: 12, fill: '#0f172a', fontWeight: 600}} axisLine={false} tickLine={false} width={75} />
                <Recharts.Tooltip formatter={(v, name) => [v + '%', name]} contentStyle={{borderRadius: 8, fontSize: 12, border: '1px solid #e2e8f0'}} />
                <Recharts.Legend iconType="square" wrapperStyle={{fontSize: 11}} />
                {TIER_ORDER.map(t => (
                  <Recharts.Bar key={t} dataKey={t} stackId="a" fill={TIER_COLORS[t]} />
                ))}
              </Recharts.BarChart>
            </Recharts.ResponsiveContainer>
          </div>
          <p className="text-xs text-slate-400 mt-3">Bars are normalized to 100% — each segment shows the share of listings in that price tier within the city.</p>
        </CardBody>
      </Card>

      <Card className="lg:col-span-2">
        <CardHeader title="Best-value districts" subtitle={'Lowest median price/m² for ' + (PROPERTY_TYPES.find(p=>p.key===ptype)?.label.toLowerCase()) + ' (≥100 listings)'} />
        <CardBody className="pt-0">
          <div className="space-y-4">
            {bestValue.map(({ city, top }) => (
              <div key={city}>
                <div className="flex items-center gap-2 mb-2">
                  <div className="w-2 h-2 rounded-full" style={{background: CITY_COLORS[city]}}></div>
                  <div className="text-xs font-semibold text-slate-500 uppercase tracking-wider">{city}</div>
                </div>
                {top.length === 0 ? (
                  <div className="text-xs text-slate-400 italic pl-4">Not enough listings for this property type.</div>
                ) : (
                  <div className="space-y-1.5">
                    {top.map((r, i) => (
                      <div key={i} className="flex items-center justify-between pl-4 text-sm">
                        <span className="text-slate-700">{i+1}. {r.district_name}</span>
                        <span className="text-xs text-slate-500 num-mono">
                          {(r.median_ppm2/1e6).toFixed(0)}M VND/m² · {fmtInt(r.listings)} listings
                        </span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ))}
          </div>
        </CardBody>
      </Card>
    </div>
  );
}

/* =====================================================================
 * Footer — Methodology & Caveats
 * ===================================================================== */
function Footer() {
  return (
    <div className="mt-8 pb-12">
      <Card>
        <CardHeader title="Methodology & caveats" subtitle="How to read these numbers" />
        <CardBody>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 text-sm text-slate-600 leading-relaxed">
            <div>
              <h4 className="font-semibold text-slate-900 mb-2">Data source & scope</h4>
              <p>
                Source: <a className="text-blue-600 hover:underline" href="https://huggingface.co/datasets/tinixai/vietnam-real-estates" target="_blank" rel="noopener">tinixai/vietnam-real-estates</a> on Hugging Face — 3.5M raw listings from {META.month_range[0]} to {META.month_range[1]}, curated by TiniX AI. After filtering to Hanoi, HCMC and Da Nang and applying sanity cleaning, {Number(META.total_clean_rows).toLocaleString()} listings are reflected in this dashboard.
              </p>
            </div>
            <div>
              <h4 className="font-semibold text-slate-900 mb-2">Cleaning rules</h4>
              <p>
                Listings are kept only when price ∈ [{(META.cleaning_rules.price_vnd_range[0]/1e6).toFixed(0)}M, {(META.cleaning_rules.price_vnd_range[1]/1e9).toFixed(0)}B] VND, area ∈ [{META.cleaning_rules.area_m2_range[0]}, {META.cleaning_rules.area_m2_range[1]}] m², and price/m² ∈ [{(META.cleaning_rules.ppm2_vnd_range[0]/1e6).toFixed(0)}M, {(META.cleaning_rules.ppm2_vnd_range[1]/1e6).toFixed(0)}M] VND/m². District medians require ≥10 listings in a given month.
              </p>
            </div>
            <div>
              <h4 className="font-semibold text-slate-900 mb-2">Sale vs rent</h4>
              <p>
                The source dataset contains both sale and rent listings without an explicit flag. Our classifier found rent listings are ≪1% of the sample, so this dashboard effectively reflects the <strong>sale market</strong>. Rental yield analysis is not viable with this data.
              </p>
            </div>
            <div>
              <h4 className="font-semibold text-slate-900 mb-2">Seasonality warning</h4>
              <p>
                All three cities show listing surges of +100% or more in March 2026. This is almost certainly a <strong>post-Tết rebound</strong> — the Vietnamese New Year falls in late January / early February and the market goes quiet during the holiday. Read March 2026 deltas in that context.
              </p>
            </div>
            <div>
              <h4 className="font-semibold text-slate-900 mb-2">Median vs mean</h4>
              <p>
                All price/m² figures are <strong>medians</strong>. Medians are more robust to the very long right tail of the Vietnam property market (luxury villas and land plots) than means. Quartile data is available in the raw monthly aggregates if a deeper distribution view is needed.
              </p>
            </div>
            <div>
              <h4 className="font-semibold text-slate-900 mb-2">Currency</h4>
              <p>
                Primary units are Vietnamese Dong (VND). Approximate USD equivalents use a flat {VND_PER_USD.toLocaleString()} VND / USD rate for intuition — not a trading rate. Real FX fluctuates; use local numbers for any transaction decisions.
              </p>
            </div>
            <div className="md:col-span-2">
              <h4 className="font-semibold text-slate-900 mb-2">License</h4>
              <p>
                Source dataset is <strong>CC BY-NC 4.0</strong>: free for academic and internal research use, commercial use requires written permission from TiniX AI. Treat any external distribution of this dashboard accordingly.
              </p>
            </div>
          </div>
        </CardBody>
      </Card>
      <div className="text-center mt-4 text-xs text-slate-400">
        Generated {META.generated_at.slice(0,10)} · {META.shards_processed.length} parquet shards processed · single self-contained HTML file
      </div>
    </div>
  );
}

function App() {
  return (
    <div className="min-h-screen">
      <Header />
      <main className="max-w-7xl mx-auto px-6 py-6 space-y-6">
